[project]
name = "qm-well"
version = "0.1.0"
description = "Filleted Infinite Potential Well - Quantum Mechanics Solution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "rifusaki-catkit>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
]
